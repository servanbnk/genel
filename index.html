<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ufak Bir İtiraf...</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050304;
            font-family: 'Montserrat', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        /* --- ALT KATMAN: GİZLİ VE ROMANTİK MESAJ --- */
        #hidden-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a0a10 0%, #050304 100%);
            z-index: 1;
            padding: 30px;
            box-sizing: border-box;
        }

        .hidden-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #ffb3c6;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(255, 179, 198, 0.4);
        }

        .hidden-text {
            font-size: 1.2rem;
            font-weight: 300;
            color: #e6e6e6;
            line-height: 1.8;
            max-width: 600px;
            letter-spacing: 1px;
        }

        .hidden-text span {
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* --- ÜST KATMAN: SİSLİ CANVAS (SİLİNECEK ALAN) --- */
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
            transition: opacity 1.5s ease; 
        }

        /* Yönlendirme Metni */
        #instruction {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        @media (max-width: 768px) {
            .hidden-title { font-size: 2rem; }
            .hidden-text { font-size: 1.05rem; }
            #instruction { font-size: 0.9rem; width: 90%; }
        }
    </style>
</head>
<body>

    <!-- GİZLİ İÇERİK -->
    <div id="hidden-layer">
        <div class="hidden-title">Sadece bir itiraf...</div>
        <div class="hidden-text">
            Seninle konuşurken zamanın nasıl geçtiğini, sıradan bir günün bile bir anda nasıl güzelleştiğini fark ettim.<br><br>
            Bugün senden hiçbir şey istemiyorum. Sadece bil istedim; <span>ekranın diğer ucunda, sırf sen yazdın diye sebepsizce gülümseyen biri var.</span>
        </div>
    </div>

    <!-- SİSLİ YÜZEY -->
    <div id="instruction">ARADAKİ SİSLERİ DAĞIT...</div>
    <canvas id="scratch-canvas"></canvas>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function fillCanvas() {
            let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, '#1c1518');
            gradient.addColorStop(1, '#050304');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        fillCanvas();

        let isDrawing = false;
        const brushSize = 90; 

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, brushSize, 0, Math.PI * 2);
            ctx.fill();

            if (instruction.style.opacity !== '0') {
                instruction.style.transition = 'opacity 0.5s';
                instruction.style.opacity = '0';
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            scratch(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) scratch(e.clientX, e.clientY);
        });
        canvas.addEventListener('mouseup', () => { isDrawing = false; checkReveal(); });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const touch = e.touches[0];
            scratch(touch.clientX, touch.clientY);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing) {
                const touch = e.touches[0];
                scratch(touch.clientX, touch.clientY);
            }
        });
        canvas.addEventListener('touchend', () => { isDrawing = false; checkReveal(); });

        function checkReveal() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) {
                    transparentPixels++;
                }
            }

            const totalPixels = canvas.width * canvas.height;
            const clearPercentage = (transparentPixels / totalPixels) * 100;

            if (clearPercentage > 40) {
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.display = 'none';
                }, 1500);
            }
        }

        window.addEventListener('resize', () => {
            if(canvas.style.display !== 'none') {
               canvas.width = window.innerWidth;
               canvas.height = window.innerHeight;
               fillCanvas();
            }
        });
    </script>
</body>
</html>
