<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatlı Bir Soru</title>
    <!-- Google Fonts üzerinden romantik ve okunaklı el yazısı fontlarını içe aktarıyoruz -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Temel sayfa ayarları: Tam ekran, kaydırma çubuğu yok ve esnek (flex) merkezleme */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Uçuşan kalplerin sayfayı kaydırmasını engeller */
            /* Sıcak şeftali ve yumuşak pembe tonlarında romantik degrade arka plan */
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
        }

        /* Metin kutusunun diğer öğelerin (kalplerin) üstünde kalmasını sağlar */
        .text-container {
            z-index: 10;
            text-align: center;
            padding: 0 20px;
        }

        /* Ana metin stili ve animasyon çağrısı */
        h1 {
            /* Renk olarak tatlı bir kırmızı-pembe tonu */
            color: #d13054;
            /* Ekran boyutuna göre otomatik ayarlanan, mobil uyumlu yazı boyutu */
            font-size: clamp(2.5rem, 8vw, 5rem);
            line-height: 1.3;
            /* Hafif romantik bir ışıltı/gölge efekti */
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.6), 1px 1px 2px rgba(0,0,0,0.1);
            /* Görünürlüğü başta sıfır yapıp animasyonla artırıyoruz */
            opacity: 0;
            animation: popIn 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* İç açıcı bir "belirme ve hafif zıplama" animasyonu */
        @keyframes popIn {
            0% { 
                opacity: 0; 
                transform: translateY(40px) scale(0.8); 
            }
            60% { 
                opacity: 1; 
                transform: translateY(-10px) scale(1.05); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        /* Arkada uçuşan kalpleri barındıracak taşıyıcı */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Kalplerin tıklamaları engellememesi için */
            z-index: 1;
        }

        /* Tekil kalp stili */
        .heart {
            position: absolute;
            bottom: -50px; /* Ekranın hemen altından başlar */
            color: rgba(255, 255, 255, 0.6); /* Yarı saydam beyaz-pembe kalpler */
            text-shadow: 0 0 5px rgba(255, 182, 193, 0.8);
            user-select: none;
        }

        /* Kalplerin yukarı doğru yüzerek kaybolma animasyonu */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 1; /* Hızlıca görünür ol */
            }
            100% {
                /* Ekranın en üstünden yukarı çıkarak hafif döner */
                transform: translateY(-110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Arka plan animasyonu için kalplerin ekleneceği alan -->
    <div id="heart-container"></div>

    <!-- Ortalanmış ana romantik mesajımız -->
    <div class="text-container">
        <h1>pijamanda hoşmuş bekar mısın acaba</h1>
        <h1>Numaranı alabilir miyim?</h1>
        <h1> Helinnnnnnnnnnnnnnnnnnnn</h1>
    </div>

    <script>
        // Arka planda uçuşan kalpler oluşturmak için JavaScript
        const heartContainer = document.getElementById('heart-container');

        // Renk paleti - daha hoş bir etki için beyaz ve pembe tonları
        const heartColors = ['rgba(255, 255, 255, 0.7)', 'rgba(255, 192, 203, 0.8)', 'rgba(255, 105, 180, 0.6)'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Kalp sembolü
            heart.innerHTML = '&#10084;'; 
            
            // Kalbin yatay pozisyonu (0% ile 100% arası rastgele)
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Animasyon süresi (4 saniye ile 9 saniye arası rastgele, hızları değiştirir)
            const animationDuration = Math.random() * 5 + 4;
            heart.style.animation = `floatUp ${animationDuration}s linear forwards`;
            
            // Kalbin boyutu (15px ile 40px arası rastgele)
            heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
            
            // Kalbin rengi (listeden rastgele seçilir)
            const randomColor = heartColors[Math.floor(Math.random() * heartColors.length)];
            heart.style.color = randomColor;

            heartContainer.appendChild(heart);

            // Animasyon bitiminde (en yavaş süreden sonra) DOM'dan temizle ki bellek dolmasın
            setTimeout(() => {
                heart.remove();
            }, animationDuration * 1000);
        }

        // Sayfa yüklendiğinde düzenli aralıklarla (350ms) kalp üretmeye başla
        setInterval(createHeart, 350);
        
        // Sayfa ilk açıldığında ekranda anında birkaç kalp olması için
        for(let i=0; i<5; i++){
            setTimeout(createHeart, i*100);
        }
    </script>
</body>
</html>
