<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delici bakışlarınn</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Resim gelmeden önceki koyu arka plan */
            font-family: 'Montserrat', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        /* --- ARKA PLAN RESMİ VE ANİMASYONU --- */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('gchat.jpeg'); /* Fotoğrafının tam adı */
            background-size: cover;
            background-position: center;
            opacity: 0; /* Başlangıçta görünmez */
            z-index: -2;
            transition: opacity 4s ease-in-out; /* 4 saniyede çok yavaşça belirme efekti */
        }

        /* Yazının rahat okunabilmesi için sinematik bir karanlık filtre */
        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65); /* Hafif transparan siyah */
            z-index: -1;
        }

        /* --- MERKEZİ İÇERİK --- */
        .content-container {
            text-align: center;
            z-index: 10;
            padding: 0 30px;
            opacity: 0;
            animation: fadeInContent 2.5s ease-in-out forwards;
            animation-delay: 0.5s; /* Sayfa açıldıktan yarım saniye sonra metin belirmeye başlar */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #ebdcb2; /* Yumuşak, romantik bir krem/şampanya rengi */
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.9;
            color: #f0f0f0;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        @keyframes fadeInContent {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Arka plan resmi ve karanlık filtre -->
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>

    <!-- Kısa ve Öz Mesaj Alanı -->
    <div class="content-container">
        <h1>Tamamlandık...</h1>
        <p>
            Milyarlarca insan, sayısız ihtimal arasından birbirimizi bulduk.<br><br>
            Seninle eksik parçam yerine oturdu, ruhum ait olduğu yeri buldu.<br>
            İyi ki Seni buldum güzelim.
        </p>
    </div>

    <script>
        // --- ARKA PLAN RESMİ GECİKMELİ GÖSTERİMİ ---
        window.addEventListener('load', () => {
            // Sayfa yüklendikten 2 saniye sonra arka plan resmi arkadan yavaşça belirmeye başlar
            setTimeout(() => {
                document.getElementById('bg-image').style.opacity = '1';
            }, 2000); 
        });
    </script>
</body>
</html>
